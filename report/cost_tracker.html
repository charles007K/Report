<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cost Tracker — Boutique Consultancy</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#1A2744;--gold:#C8A55A;
  --white:#fff;--surface:#f7f8fc;--border:#e5e7eb;
  --text:#1a1a1a;--muted:#6b7280;--danger:#dc2626;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f1f3f8;color:var(--text);min-height:100vh;display:flex}
#sidebar{width:200px;flex-shrink:0;background:var(--navy);min-height:100vh;display:flex;flex-direction:column}
.sidebar-brand{padding:20px 16px 16px;border-bottom:1px solid rgba(255,255,255,0.1)}
.sidebar-brand h1{font-size:14px;font-weight:600;color:var(--gold);letter-spacing:.03em}
.sidebar-brand p{font-size:11px;color:rgba(255,255,255,0.45);margin-top:2px}
.nav-item{display:flex;align-items:center;gap:10px;padding:11px 16px;color:rgba(255,255,255,0.6);font-size:13px;cursor:pointer;border-left:3px solid transparent;transition:all .15s;background:none;border-top:none;border-right:none;border-bottom:none;width:100%;text-align:left;font-family:inherit}
.nav-item:hover{color:#fff;background:rgba(255,255,255,0.06)}
.nav-item.active{color:#fff;background:rgba(200,165,90,0.15);border-left-color:var(--gold)}
.nav-item svg{width:16px;height:16px;flex-shrink:0;opacity:.7}
.nav-item.active svg,.nav-item:hover svg{opacity:1}
.nav-footer{margin-top:auto;padding:12px 16px;border-top:1px solid rgba(255,255,255,0.1)}
.nav-footer p{font-size:11px;color:rgba(255,255,255,0.3)}
#main{flex:1;padding:28px 32px;overflow-y:auto;min-width:0}
.page{display:none}.page.active{display:block}
.card{background:#fff;border:0.5px solid var(--border);border-radius:12px;padding:20px 24px;margin-bottom:16px}
.card-title{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:16px}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.metric{background:#fff;border:0.5px solid var(--border);border-radius:10px;padding:14px 16px}
.metric-label{font-size:12px;color:var(--muted);margin-bottom:4px}
.metric-val{font-size:22px;font-weight:600;color:var(--text)}
.metric-val.red{color:var(--danger)}
.form-grid{display:grid;gap:12px}
.form-row{display:grid;gap:12px}
.form-row.cols-2{grid-template-columns:1fr 1fr}
.form-row.cols-3{grid-template-columns:1fr 1fr 1fr}
.form-group{display:flex;flex-direction:column;gap:5px}
label{font-size:12px;font-weight:500;color:var(--muted)}
input,select,textarea{font-size:13px;padding:8px 10px;border:0.5px solid var(--border);border-radius:8px;background:#fff;color:var(--text);outline:none;width:100%;font-family:inherit}
input:focus,select:focus,textarea:focus{border-color:#94a3b8;box-shadow:0 0 0 3px rgba(148,163,184,.15)}
textarea{resize:none}
.btn{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:8px 14px;border-radius:8px;border:0.5px solid var(--border);background:transparent;color:var(--text);cursor:pointer;font-family:inherit}
.btn:hover{background:var(--surface)}
.btn-primary{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn-primary:hover{opacity:.88;background:var(--navy)}
.btn-danger{color:var(--danger);border-color:#fecaca}
.btn-danger:hover{background:#fef2f2}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-row{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}

#sync-bar{display:flex;align-items:center;gap:8px;font-size:12px;padding:8px 14px;border-radius:8px;margin-bottom:14px;font-weight:500;transition:all .15s}
#sync-bar.busy{background:#f1f5f9;color:var(--muted)}
#sync-bar.ok{background:#dcfce7;color:#166534}
#sync-bar.err{background:#fee2e2;color:#991b1b}
#sync-bar.warn{background:#fee2e2;color:#991b1b}
#sync-bar.hidden{display:none}
.spinner{width:13px;height:13px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:spin .6s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.entries-wrap{display:flex;flex-direction:column;gap:8px}
.entry-card{background:#fff;border:0.5px solid var(--border);border-radius:10px;padding:12px 14px;display:flex;align-items:flex-start;gap:12px}
.entry-bar{width:3px;border-radius:2px;flex-shrink:0;align-self:stretch;min-height:36px}
.entry-body{flex:1;min-width:0}
.entry-desc{font-size:13px;font-weight:500;color:var(--text)}
.entry-meta{font-size:11px;color:var(--muted);margin-top:2px}
.entry-note{font-size:11px;color:var(--muted);font-style:italic;margin-top:2px}
.entry-amt{font-size:14px;font-weight:600;flex-shrink:0;color:var(--text)}
.entry-actions{display:flex;gap:4px;flex-shrink:0}
.badge-pill{font-size:10px;padding:1px 6px;border-radius:99px;margin-left:4px}
.filter-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.pill{font-size:12px;padding:5px 12px;border-radius:99px;border:0.5px solid var(--border);cursor:pointer;background:transparent;color:var(--muted);font-family:inherit}
.pill.active,.pill:hover{background:var(--navy);color:#fff;border-color:var(--navy)}
.empty{text-align:center;padding:40px 20px;color:var(--muted);font-size:13px}
.empty svg{width:36px;height:36px;margin:0 auto 10px;display:block;opacity:.3}
.chart-wrap{height:260px;position:relative;margin-top:8px}
.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.bar-label{font-size:12px;color:var(--muted);width:100px;text-align:right;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{flex:1;height:8px;background:var(--surface);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px;transition:width .3s}
.bar-amt{font-size:12px;color:var(--muted);min-width:80px;text-align:right}
#month-drill{display:none;background:#fff;border:0.5px solid var(--border);border-radius:12px;padding:20px 24px;margin-bottom:16px}
#month-drill.open{display:block}
.drill-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.drill-title{font-size:13px;font-weight:600;color:var(--navy)}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:200;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:#fff;border-radius:14px;padding:24px;width:560px;max-width:95vw;max-height:90vh;overflow-y:auto}
.modal-title{font-size:15px;font-weight:600;margin-bottom:16px}
.modal-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;padding-top:12px;border-top:.5px solid var(--border)}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
@media(max-width:900px){
  body{flex-direction:column}
  #sidebar{width:100%;min-height:auto;flex-direction:row;flex-wrap:wrap}
  .sidebar-brand{padding:12px 16px;border-bottom:none;border-right:1px solid rgba(255,255,255,0.1)}
  .nav-item{border-left:none;border-bottom:3px solid transparent;padding:10px 14px;flex:1;justify-content:center}
  .nav-item.active{border-bottom-color:var(--gold);border-left-color:transparent}
  .nav-footer{display:none}
  #main{padding:16px}
}
@media(max-width:640px){
  .metrics{grid-template-columns:1fr 1fr}
  .chart-grid{grid-template-columns:1fr}
  .form-row.cols-3{grid-template-columns:1fr 1fr}
  .form-row.cols-2{grid-template-columns:1fr}
  #main{padding:12px}
  .card{padding:14px 16px}
}
@media(max-width:420px){
  .metrics{grid-template-columns:1fr}
  .form-row.cols-3{grid-template-columns:1fr}
}
</style>
</head>
<body>

<nav id="sidebar">
  <div class="sidebar-brand">
    <h1>GoFiducia Cost Tracker</h1>
    <p>Boutique Consultancy</p>
  </div>
  <button class="nav-item active" onclick="showPage('record',this)">

    Record
  </button>

    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>

<main id="main">

<!-- RECORD PAGE -->
<div id="page-record" class="page active">
  <div id="sync-bar" class="hidden"></div>
  <div class="metrics">
    <div class="metric"><div class="metric-label">This month entries</div><div class="metric-val" id="st-count">0</div></div>
    <div class="metric"><div class="metric-label">This month total</div><div class="metric-val red" id="st-month">€ 0,00</div></div>
    <div class="metric"><div class="metric-label">All-time total</div><div class="metric-val" id="st-total">€ 0,00</div></div>
  </div>
  <div class="card">
    <div class="card-title">New cost entry</div>
    <div class="form-grid">
      <div class="form-row cols-2">
        <div class="form-group"><label>Date</label><input type="date" id="inp-date"></div>
        <div class="form-group"><label>Amount (€)</label><input type="number" id="inp-amount" step="0.01" min="0"></div>
      </div>
      <div class="form-group"><label>Description</label><input type="text" id="inp-desc"></div>
      <div class="form-row cols-2">
        <div class="form-group">
          <label>Category</label>
          <select id="inp-cat">
            <option value="Personnel">Personnel</option>
            <option value="Office">Office</option>
            <option value="Travel">Travel</option>
            <option value="Marketing">Marketing</option>
            <option value="Professional">Professional services</option>
            <option value="Communications">Communications</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div class="form-group"><label>Vendor</label><input type="text" id="inp-vendor"></div>
      </div>
      <div class="form-row cols-3">
        <div class="form-group">

          <select id="inp-method">

        </div>
        <div class="form-group">

          <select id="inp-reimb"><option value="No">No</option><option value="Yes">Yes</option></select>

        <div class="form-group">
          <label>Recurring</label>

            <option value="No">One-time</option><option value="Monthly">Monthly</option>

        </div>
      </div>
      <div class="form-row cols-2">
        <div class="form-group">
          <label>Invoice included</label>
          <select id="inp-invoice"><option value="No">No</option><option value="Yes">Yes</option></select>

          <label>Invoice type</label>
          <select id="inp-invoice-type">

</div>

<!-- ENTRIES PAGE -->
<div id="page-list" class="page">
  <div class="filter-row" id="filter-pills"></div>
  <div id="entry-list"></div>
</div>

<!-- SUMMARY PAGE -->
<div id="page-summary" class="page">
  <div class="metrics">
    <div class="metric"><div class="metric-label">Total spent</div><div class="metric-val red" id="sum-total">€ 0,00</div></div>
    <div class="metric"><div class="metric-label">Total entries</div><div class="metric-val" id="sum-count">0</div></div>
    <div class="metric"><div class="metric-label">Average entry</div><div class="metric-val" id="sum-avg">€ 0,00</div></div>

  <div class="chart-grid">
    <div class="card">
      <div class="card-title">By category — share</div>
      <div class="chart-wrap"><canvas id="pie-chart"></canvas></div>
    </div>
    <div class="card">

      <div class="chart-wrap"><canvas id="bar-chart"></canvas></div>

  <div id="month-drill">

</main>

<!-- Edit modal -->
<div class="modal-overlay" id="edit-modal">

            <option value="Travel">Travel</option><option value="Marketing">Marketing</option>
            <option value="Professional">Professional services</option>
            <option value="Communications">Communications</option><option value="Other">Other</option>
          </select>
        </div>
        <div class="form-group"><label>Vendor</label><input type="text" id="e-vendor"></div>
      </div>

        <div class="form-group">
          <label>Payment</label>
          <select id="e-method">
            <option>Bank transfer</option><option>Credit card</option><option>Cash</option>
            <option>PayPal</option><option>Alipay</option><option>WeChat Pay</option><option>Other</option>
          </select>
        </div>

          <label>Reimbursable</label>
          <select id="e-reimb"><option value="No">No</option><option value="Yes">Yes</option></select>
        </div>
        <div class="form-group">
          <label>Recurring</label>
          <select id="e-recur">
            <option value="No">One-time</option><option value="Monthly">Monthly</option>
            <option value="Quarterly">Quarterly</option><option value="Annual">Annual</option>
          </select>
        </div>
      </div>

        <div class="form-group">
          <label>Invoice included</label>

        </div>
        <div class="form-group">
          <label>Invoice type</label>
          <select id="e-invoice-type">
            <option value="N/A">N/A</option>

<script>
// ── CONFIG — fill in both values ─────────────────────────────
const WORKER_URL = 'https://costtracker.charles007sun.workers.dev/api/data';
const API_SECRET = '123321QWER';  
// ─────────────────────────────────────────────────────────────

const CATS = ['Personnel','Office','Travel','Marketing','Professional','Communications','Other'];
const CAT_COLORS = {
  Personnel:'#3b82f6',Office:'#22c55e',Travel:'#eab308',
  Marketing:'#ec4899',Professional:'#8b5cf6',Communications:'#f97316',Other:'#9ca3af'
};
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

let entries = [];
let activeFilter = 'All';
let editId = null;
let pieChart = null;
let barChart = null;
let isSyncing = false;
let pendingPush = false;

// ── Sync bar ─────────────────────────────────────────────────
function syncBar(state, msg) {
  const el = document.getElementById('sync-bar');
  el.className = state;
  el.innerHTML = state === 'busy'
    ? `<div class="spinner"></div><span>${msg}</span>`
    : `<span>${msg}</span>`;
  if (state === 'ok') setTimeout(() => el.className = 'hidden', 2800);
}

// ── API calls ─────────────────────────────────────────────────
async function apiGet() {
  const res = await fetch(WORKER_URL, {
    headers: { 'X-Api-Secret': API_SECRET }
  });
  if (!res.ok) throw new Error(`Load failed: ${res.status}`);
  return res.json();
}

async function apiPut(data) {
  const res = await fetch(WORKER_URL, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json', 'X-Api-Secret': API_SECRET },
    body: JSON.stringify(data)
  });
  if (!res.ok) throw new Error(`Save failed: ${res.status}`);
}

// ── Load from Worker KV ───────────────────────────────────────
async function load() {
  syncBar('busy', 'Loading data…');
  try {
    const data = await apiGet();
    entries = Array.isArray(data) ? data : [];
    syncBar('ok', `Data loaded \u2713`);
  } catch (e) {
    syncBar('err', `Could not load: ${e.message}`);
  }
  updateStats();
  renderList();
}

// ── Save to Worker KV (debounced, queue) ──────────────────────
async function save() {
  if (isSyncing) { pendingPush = true; return; }
  isSyncing = true;
  syncBar('busy', 'Saving…');
  try {
    await apiPut(entries);
    syncBar('ok', `Saved \u2713 ${new Date().toLocaleTimeString('it-IT')}`);
  } catch (e) {
    syncBar('err', `Save failed: ${e.message}`);
    toast('Save failed — check connection', 'err');
  } finally {
    isSyncing = false;
    if (pendingPush) { pendingPush = false; await save(); }
  }
}

// ── Utilities ─────────────────────────────────────────────────
function fmt(n) {
  return '\u20ac\u00a0' + Math.abs(Number(n))
    .toLocaleString('it-IT', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function today() { return new Date().toISOString().slice(0, 10); }
function toast(msg, type) {
  const barType = type === 'err' ? 'err' : type === 'ok' ? 'ok' : type === 'warn' ? 'warn' : 'busy';
  syncBar(barType, msg);
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => syncBar('hidden', ''), 2800);
}

// ── Navigation ────────────────────────────────────────────────
function showPage(name, el) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  el.classList.add('active');
  if (name === 'list') renderList();
  if (name === 'summary') renderSummary();
  if (name === 'record') updateStats();
}

// ── Form ──────────────────────────────────────────────────────
function clearForm() {
  document.getElementById('inp-date').value = today();
  ['inp-amount','inp-desc','inp-vendor','inp-note'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('inp-cat').value = 'Personnel';
  document.getElementById('inp-method').value = 'Bank transfer';
  document.getElementById('inp-reimb').value = 'No';
  document.getElementById('inp-recur').value = 'No';
  document.getElementById('inp-invoice').value = 'No';
  document.getElementById('inp-invoice-type').value = 'N/A';
}

function addEntry() {
  const date   = document.getElementById('inp-date').value;
  const amount = parseFloat(document.getElementById('inp-amount').value);
  const desc   = document.getElementById('inp-desc').value.trim();
  if (!date)            { toast('Date required', 'err'); return; }
  if (!amount || amount <= 0) { toast('Enter a valid amount', 'err'); return; }
  if (!desc)            { toast('Description required', 'err'); return; }
  entries.push({
    id: Date.now(), date, amount, desc,
    cat:         document.getElementById('inp-cat').value,
    vendor:      document.getElementById('inp-vendor').value.trim(),
    method:      document.getElementById('inp-method').value,
    reimb:       document.getElementById('inp-reimb').value,
    recur:       document.getElementById('inp-recur').value,
    invoice:     document.getElementById('inp-invoice').value,
    invoiceType: document.getElementById('inp-invoice-type').value,
    note:        document.getElementById('inp-note').value.trim()
  });
  entries.sort((a, b) => b.date.localeCompare(a.date));
  save(); updateStats(); clearForm(); toast('Entry saved', 'ok');
}

function updateStats() {
  const ym = new Date().toISOString().slice(0, 7);
  const m  = entries.filter(e => e.date.startsWith(ym));
  document.getElementById('st-count').textContent = m.length;
  document.getElementById('st-month').textContent = fmt(m.reduce((s, e) => s + e.amount, 0));
  document.getElementById('st-total').textContent = fmt(entries.reduce((s, e) => s + e.amount, 0));
}

// ── Entry card ────────────────────────────────────────────────
function entryCardHTML(e) {
  const recBadge  = e.recur && e.recur !== 'No'
    ? `<span class="badge-pill" style="background:#e0e7ff;color:#3730a3">${e.recur}</span>` : '';
  const reimBadge = e.reimb === 'Yes'
    ? `<span class="badge-pill" style="background:#dcfce7;color:#166534">Reimbursable</span>` : '';
  const invBadge  = e.invoice === 'Yes'
    ? `<span class="badge-pill" style="background:#fef9c3;color:#92400e">${e.invoiceType || 'Invoice'}</span>` : '';
  const meta = [e.cat, e.vendor, e.method].filter(Boolean).join(' \u00b7 ');
  return `<div class="entry-card">
    <div class="entry-bar" style="background:${CAT_COLORS[e.cat] || '#ccc'}"></div>
    <div class="entry-body">
      <div class="entry-desc">${e.desc}${recBadge}${reimBadge}${invBadge}</div>
      <div class="entry-meta">${e.date}${meta ? ' \u00b7 ' + meta : ''}</div>
      ${e.note ? `<div class="entry-note">${e.note}</div>` : ''}
    </div>
    <div class="entry-amt">${fmt(e.amount)}</div>
    <div class="entry-actions">
      <button class="btn btn-sm" onclick="openEdit(${e.id})" title="Edit">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
      </button>
      <button class="btn btn-sm btn-danger" onclick="deleteEntry(${e.id})" title="Delete">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>
      </button>
    </div>
  </div>`;
}

// ── Entries list ──────────────────────────────────────────────
function buildPills() {
  document.getElementById('filter-pills').innerHTML =
    ['All', ...CATS].map(f =>
      `<button class="pill${activeFilter === f ? ' active' : ''}" onclick="setFilter('${f}',this)">${f}</button>`
    ).join('');
}
function setFilter(cat, el) {
  activeFilter = cat;
  document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
  el.classList.add('active');
  renderList();
}
function renderList() {
  buildPills();
  const c = document.getElementById('entry-list');
  const list = activeFilter === 'All' ? entries : entries.filter(e => e.cat === activeFilter);
  if (!list.length) {
    c.innerHTML = `<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>No entries${activeFilter !== 'All' ? ' in ' + activeFilter : ''}</div>`;
    return;
  }
  c.innerHTML = `<div class="entries-wrap">${list.map(entryCardHTML).join('')}</div>`;
}

function deleteEntry(id) {
  entries = entries.filter(e => e.id !== id);
  save(); renderList(); updateStats();
  if (document.getElementById('page-summary').classList.contains('active')) { renderSummary(); closeDrill(); }
  toast('Entry deleted', 'ok');
}

// ── Edit modal ────────────────────────────────────────────────
function openEdit(id) {
  const e = entries.find(x => x.id === id);
  if (!e) return;
  editId = id;
  document.getElementById('e-date').value         = e.date;
  document.getElementById('e-amount').value       = e.amount;
  document.getElementById('e-desc').value         = e.desc;
  document.getElementById('e-cat').value          = e.cat;
  document.getElementById('e-vendor').value       = e.vendor || '';
  document.getElementById('e-method').value       = e.method || 'Bank transfer';
  document.getElementById('e-reimb').value        = e.reimb || 'No';
  document.getElementById('e-recur').value        = e.recur || 'No';
  document.getElementById('e-invoice').value      = e.invoice || 'No';
  document.getElementById('e-invoice-type').value = e.invoiceType || 'N/A';
  document.getElementById('e-note').value         = e.note || '';
  document.getElementById('edit-modal').classList.add('open');
}
function closeModal() {
  document.getElementById('edit-modal').classList.remove('open');
  editId = null;
}
function saveEdit() {
  if (!editId) return;
  const idx = entries.findIndex(x => x.id === editId);
  if (idx < 0) return;
  const date   = document.getElementById('e-date').value;
  const amount = parseFloat(document.getElementById('e-amount').value);
  const desc   = document.getElementById('e-desc').value.trim();
  if (!date || !amount || amount <= 0 || !desc) { toast('Date, amount and description required', 'err'); return; }
  entries[idx] = {
    ...entries[idx], date, amount, desc,
    cat:         document.getElementById('e-cat').value,
    vendor:      document.getElementById('e-vendor').value.trim(),
    method:      document.getElementById('e-method').value,
    reimb:       document.getElementById('e-reimb').value,
    recur:       document.getElementById('e-recur').value,
    invoice:     document.getElementById('e-invoice').value,
    invoiceType: document.getElementById('e-invoice-type').value,
    note:        document.getElementById('e-note').value.trim()
  };
  entries.sort((a, b) => b.date.localeCompare(a.date));
  save(); closeModal();
  if (document.getElementById('page-list').classList.contains('active')) renderList();
  if (document.getElementById('page-summary').classList.contains('active')) renderSummary();
  updateStats();
  toast('Entry updated', 'ok');
}
document.getElementById('edit-modal').addEventListener('click', function(ev) {
  if (ev.target === this) closeModal();
});

// ── Month drill-down ──────────────────────────────────────────
function showMonthDrill(idx) {
  const year = new Date().getFullYear();
  const m    = String(idx + 1).padStart(2, '0');
  const me   = entries.filter(e => e.date.startsWith(`${year}-${m}`));
  const tot  = me.reduce((s, e) => s + e.amount, 0);
  document.getElementById('drill-title').textContent =
    `${MONTHS[idx]} ${year} — ${me.length} entr${me.length === 1 ? 'y' : 'ies'}, total ${fmt(tot)}`;
  document.getElementById('drill-list').innerHTML = me.length
    ? `<div class="entries-wrap">${me.map(entryCardHTML).join('')}</div>`
    : '<div class="empty" style="padding:20px 0">No entries this month</div>';
  const panel = document.getElementById('month-drill');
  panel.classList.add('open');
  panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}
function closeDrill() { document.getElementById('month-drill').classList.remove('open'); }

// ── Summary ───────────────────────────────────────────────────
function renderSummary() {
  const total = entries.reduce((s, e) => s + e.amount, 0);
  document.getElementById('sum-total').textContent = fmt(total);
  document.getElementById('sum-count').textContent = entries.length;
  document.getElementById('sum-avg').textContent   = entries.length ? fmt(total / entries.length) : fmt(0);

  const catTotals = {};
  CATS.forEach(c => catTotals[c] = 0);
  entries.forEach(e => { catTotals[e.cat] = (catTotals[e.cat] || 0) + e.amount; });

  const year = new Date().getFullYear();
  const mthTotals = MONTHS.map((_, i) => {
    const m = String(i + 1).padStart(2, '0');
    return entries.filter(e => e.date.startsWith(`${year}-${m}`)).reduce((s, e) => s + e.amount, 0);
  });

  const filteredCats = CATS.filter(c => catTotals[c] > 0);
  if (pieChart) { pieChart.destroy(); pieChart = null; }
  const pieCtx = document.getElementById('pie-chart').getContext('2d');
  if (filteredCats.length) {
    pieChart = new Chart(pieCtx, {
      type: 'doughnut',
      data: {
        labels: filteredCats,
        datasets: [{ data: filteredCats.map(c => Math.round(catTotals[c] * 100) / 100),
          backgroundColor: filteredCats.map(c => CAT_COLORS[c]), borderWidth: 2, borderColor: '#fff' }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { position: 'right', labels: { boxWidth: 12, font: { size: 11 } } },
          tooltip: { callbacks: { label: ctx => {
            const pct = total > 0 ? ((ctx.raw / total) * 100).toFixed(1) : '0,0';
            return ` ${fmt(ctx.raw)} (${pct}%)`;
          }}}
        }
      }
    });
  } else { pieCtx.clearRect(0, 0, pieCtx.canvas.width, pieCtx.canvas.height); }

  if (barChart) { barChart.destroy(); barChart = null; }
  const barCtx = document.getElementById('bar-chart').getContext('2d');
  barChart = new Chart(barCtx, {
    type: 'bar',
    data: {
      labels: MONTHS,
      datasets: [{ label: 'Amount',
        data: mthTotals.map(v => Math.round(v * 100) / 100),
        backgroundColor: mthTotals.map(() => '#1A2744'),
        hoverBackgroundColor: mthTotals.map(() => '#C8A55A'),
        borderRadius: 4, borderSkipped: false }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false },
        tooltip: { callbacks: { label: ctx => `  ${fmt(ctx.raw)}` } } },
      scales: {
        y: { ticks: { callback: v => '€ ' + Number(v).toLocaleString('it-IT') }, grid: { color: '#f0f0f0' } },
        x: { grid: { display: false } }
      },
      onClick: (_, elements) => { if (elements.length) showMonthDrill(elements[0].index); },
      onHover: (ev, elements) => { ev.native.target.style.cursor = elements.length ? 'pointer' : 'default'; }
    }
  });

  const bc = document.getElementById('cat-bars');
  if (!entries.length) { bc.innerHTML = '<div class="empty">No data yet</div>'; return; }
  const maxAmt = Math.max(...Object.values(catTotals));
  bc.innerHTML = CATS.filter(c => catTotals[c] > 0)
    .sort((a, b) => catTotals[b] - catTotals[a])
    .map(cat => {
      const amt = catTotals[cat];
      const pct = total > 0 ? ((amt / total) * 100).toFixed(1) : '0,0';
      const w   = maxAmt > 0 ? (amt / maxAmt * 100).toFixed(1) : '0';
      return `<div class="bar-row">
        <div class="bar-label">${cat}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${w}%;background:${CAT_COLORS[cat]}"></div></div>
        <div class="bar-amt">${fmt(amt)} <span style="color:#9ca3af;font-size:11px">${pct}%</span></div>
      </div>`;
    }).join('');
}

document.getElementById('inp-date').value = today();
load();
</script>
